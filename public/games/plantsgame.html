<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Science Farm Quiz Game with Stars</title>
<style>
  body {
    background: linear-gradient(to bottom right, #eafdff 40%, #d2ffc4 100%);
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    align-items: flex-start;
    padding: 30px 0;
    transition: background 0.6s;
    overflow-x: hidden;
  }
  #quiz-container, #game-container {
    background: rgba(255,255,255,.93);
    border-radius: 18px;
    box-shadow: 0 8px 32px #88c98e19;
    padding: 36px 34px;
    min-width: 330px;
    margin-bottom: 28px;
    margin-right: 12px;
    position: relative;
    flex: 1 1 340px;
    max-width: 460px;
    z-index: 1;
  }
  #quiz-container {
    border: 2px solid #2b6643;
  }
  #game-container {
    border: 2px solid #4b7257;
  }
  #timer {
    font-size: 2.1em;
    color: #e0303a;
    font-weight: bold;
    margin-bottom: 22px;
    letter-spacing: 1px;
  }
  #question {
    font-size: 1.13em;
    margin-bottom: 10px;
    color: #285e3c;
    font-weight: bold;
  }
  .option {
    display: block;
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    width: 96%;
    font-size: 1em;
    transition: background 0.15s, box-shadow 0.15s;
    background: #eafcde;
    text-align: left;
    outline: none;
    box-shadow: 0 2px 4px #b1caab15;
  }
  .option:hover, .option.selected {
    background: #b7f3c8 !important;
    box-shadow: 0 0 8px #70c88439;
    outline: 2px solid #65be89;
  }
  #result {
    font-size: 1.11em;
    margin-top: 18px;
    min-height: 32px;
    font-weight: bold;
  }
  #game-container h3 {
    text-align: center;
    margin-top: 0; margin-bottom: 5px; color: #328152;
    font-size: 1.08em;
  }
  #score {
    font-size: 1.05em;
    margin-bottom: 7px;
    color: #318c35;
  }
  #farmCanvas {
    background: repeating-linear-gradient(
      45deg, #e7ffec, #e7ffec 30px, #c7e6b5 30px, #c7e6b5 60px
    );
    border-radius: 16px;
    border: 2px solid #388055;
    display: block;
    margin: 0 auto 9px auto;
  }
  #game-container > div {
    text-align: center;
    font-size: 1em;
    margin-bottom: 5px;
  }
  #info {
    font-size: 1em;
    margin-top: 6px;
    color: #1b5c2b;
  }
  .popup-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 12;
    background: rgba(0,0,0,.21);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadein .4s;
  }
  @keyframes fadein { from {opacity:0;} to {opacity:1;} }
  .popup {
    background: #fffde7;
    border-radius: 20px;
    box-shadow: 0 8px 32px #aee9b99c;
    padding: 38px 28px;
    min-width: 320px;
    max-width: 86vw;
    text-align: center;
    font-size: 1.19em;
    color: #234627;
    position: relative;
    overflow: hidden;
  }
  .popup h2 {
    margin-top: 0;
    font-size: 2em;
    color: #b38b00;
    text-shadow: 0 0 7px #ffd700;
  }
  .stars {
    margin: 18px 0 5px;
    font-size: 2.8em;
    color: #ffd700;
    filter: drop-shadow(0 0 6px #b38b00);
    user-select:none;
  }
  .popup .buttons {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    gap: 22px;
  }
  .popup button {
    padding: 12px 28px;
    border-radius: 8px;
    border: none;
    font-size: 1.12em;
    cursor: pointer;
    color: #fff;
    background: #b38b00;
    box-shadow: 0 2px 16px #ffdc00aa;
    transition: background 0.15s, transform 0.15s;
  }
  .popup button:hover {
    background: #ffd700;
    color: #562f00;
    transform: scale(1.1);
  }
  .popup .fail {
    background: #e03c3c;
  }
  .popup .fail:hover { background: #c11111;}
  .golden-sparkle {
    pointer-events:none;
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background:
     radial-gradient(circle at 20% 20%, #fff700aa 2px, transparent 8px),
     radial-gradient(circle at 80% 30%, #fff700aa 1.7px, transparent 6px),
     radial-gradient(circle at 40% 50%, #fff70088 3px, transparent 7px),
     radial-gradient(circle at 70% 60%, #fff700cc 1.5px, transparent 4px);
    background-repeat: repeat;
    animation: sparkle 3.5s linear infinite;
    z-index: 10;
  }
  @keyframes sparkle {
    0% {
      background-position:
       0% 0%,
       0% 0%,
       0% 0%,
       0% 0%;
    }
    100% {
      background-position:
       100% 100%,
       100% 120%,
       120% 110%,
       110% 100%;
    }
  }
  @media (max-width: 900px) {
    body { flex-direction: column; align-items: center; }
    #quiz-container, #game-container { max-width: 98vw; }
  }
</style>
</head>
<body>

<div id="quiz-container">
  <div id="timer"></div>
  <div id="question"></div>
  <div id="options"></div>
  <div id="result"></div>
</div>

<div id="game-container">
  <h3>Farm Collector Game</h3>
  <div id="score"></div>
  <canvas id="farmCanvas" width="320" height="320"></canvas>
  <div>Use Arrow keys ←↑→↓ to move farmer. Collect plants by moving over them!</div>
  <div id="info"></div>
</div>

<div id="popup-holder"></div>

<script>
  // --- MCQ Questions (loaded dynamically) ---
  let questions = [];
  
  async function loadDynamicQuestions() {
    const params = new URLSearchParams(location.search);
    const gradeParam = params.get('grade') || '';
    const subjectParam = params.get('subject') || '';

    const parseGrade = (g) => {
      if (typeof g === 'number') return g;
      const m = String(g).match(/\d+/);
      return m ? Number(m[0]) : NaN;
    };
    const normalize = (s) => String(s || '').trim().toLowerCase();
    const subjectNorm = (() => {
      const s = normalize(subjectParam);
      if (s === 'science') return 'general science';
      return s;
    })();

    // Fetch Questions.json
    const res = await fetch('/games/Questions.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('Failed to load Questions.json');
    const data = await res.json();

    // Unwrap by grade
    const g = parseGrade(gradeParam);
    let list = [];
    if (data && data.questions_by_grade && data.questions_by_grade[String(g)]) {
      list = Array.isArray(data.questions_by_grade[String(g)]) ? data.questions_by_grade[String(g)] : [];
    } else if (Array.isArray(data)) {
      list = data;
    }

    // Filter subject
    const filtered = list.filter((q) => normalize(q.subject) === subjectNorm);

    // Map to game format
    questions = filtered.map((q) => ({
      question: q.text || q.question,
      options: q.choices || q.options || [],
      answer: typeof q.answerIndex === 'number' ? q.answerIndex : q.answer
    }));
  }

  let currentQuestion = 0;
  let timer;
  const timePerQ = 17;
  let timeLeft = timePerQ;
  let score = 0;
  let correctAnswers = 0;

  // --- Farm Game Data ---
  const canvas = document.getElementById('farmCanvas');
  const ctx = canvas.getContext('2d');
  let farmer = { x: 25, y: 25, size: 36, speed: 18 };
  let plants = [];
  let plantAnim = 0;
  let lastPlant = null;

  document.getElementById('score').innerText = "Plants collected: 0";

  function showQuestion() {
    document.getElementById('result').innerText = "";
    if (currentQuestion < questions.length) {
      document.getElementById('question').innerText = questions[currentQuestion].question;
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = "";
      questions[currentQuestion].options.forEach((opt, idx) => {
        let btn = document.createElement('button');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, idx);
        optionsDiv.appendChild(btn);
      });
      timeLeft = timePerQ;
      document.getElementById('timer').innerText = `⏳ Time: ${timeLeft}s`;
      clearInterval(timer);
      timer = setInterval(updateTimer, 1000);
    } else {
      finishQuiz();
    }
  }

  function updateTimer() {
    timeLeft--;
    document.getElementById('timer').innerText = `⏳ Time: ${timeLeft}s`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      document.getElementById('result').innerText = "⏰ Time's up!";
      setTimeout(() => {
        currentQuestion++;
        showQuestion();
      }, 1000);
    }
  }

  function checkAnswer(btn, idx) {
    clearInterval(timer);
    Array.from(document.getElementsByClassName('option')).forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    if (idx === questions[currentQuestion].answer) {
      correctAnswers++;
      document.getElementById('result').innerText = "✅ Correct! You grew a plant!";
      growPlant();
    } else {
      document.getElementById('result').innerText = "❌ Incorrect!";
    }
    setTimeout(() => {
      currentQuestion++;
      showQuestion();
    }, 1000);
  }

  // --- Farm Related ---
  function growPlant() {
    let px, py;
    do {
      px = Math.floor(Math.random() * (canvas.width - 38) + 15);
      py = Math.floor(Math.random() * (canvas.height - 38) + 15);
    } while (Math.abs(px - farmer.x) < 40 && Math.abs(py - farmer.y) < 40);
    plants.push({ x: px, y: py });
    lastPlant = plants[plants.length - 1];
    plantAnim = 12;
    drawFarm();
  }

  function drawFarm() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#9cce9c";
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++)
      for (let j = 0; j < 6; j++)
        ctx.strokeRect(i * 53, j * 53, 53, 53);

    plants.forEach((p, idx) => {
      ctx.save();
      if (plantAnim > 0 && lastPlant && lastPlant.x === p.x && lastPlant.y === p.y) {
        ctx.translate(p.x + 18, p.y + 18);
        let scale = 1 + plantAnim * 0.035;
        ctx.scale(scale, scale);
        ctx.translate(-18, -18);
      }
      ctx.beginPath();
      ctx.arc(p.x + 18, p.y + 18, 14, 0, Math.PI * 2);
      ctx.fillStyle = "#48a846";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x + 18, p.y + 18, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#72fc63";
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(p.x + 18, p.y + 18);
      ctx.lineTo(p.x + 18, p.y + 8);
      ctx.strokeStyle = "#316624";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    });

    if (plantAnim > 0) {
      plantAnim--;
      if (plantAnim === 0) lastPlant = null;
      requestAnimationFrame(drawFarm);
    }

    ctx.save();
    ctx.translate(farmer.x, farmer.y);
    ctx.fillStyle = "#a45e24";
    ctx.fillRect(0, 0, farmer.size, farmer.size);
    ctx.beginPath();
    ctx.arc(farmer.size / 2, farmer.size / 2, farmer.size / 2.2, 0, Math.PI * 2);
    ctx.fillStyle = "#ffe2b0";
    ctx.fill();
    ctx.fillStyle = "#87bf5a";
    ctx.fillRect(6, 3, 24, 7);
    ctx.restore();
  }

  function moveFarmer(e) {
    let dx = 0,
      dy = 0;
    if (e.key === "ArrowUp") dy = -farmer.speed;
    if (e.key === "ArrowDown") dy = farmer.speed;
    if (e.key === "ArrowLeft") dx = -farmer.speed;
    if (e.key === "ArrowRight") dx = farmer.speed;
    if (dx !== 0 || dy !== 0) {
      farmer.x = Math.max(0, Math.min(canvas.width - farmer.size, farmer.x + dx));
      farmer.y = Math.max(0, Math.min(canvas.height - farmer.size, farmer.y + dy));
      collectPlant();
      drawFarm();
    }
  }

  function collectPlant() {
    for (let i = plants.length - 1; i >= 0; i--) {
      let p = plants[i];
      if (
        Math.abs(farmer.x + farmer.size / 2 - (p.x + 18)) < 21 &&
        Math.abs(farmer.y + farmer.size / 2 - (p.y + 18)) < 21
      ) {
        plants.splice(i, 1);
        score++;
        document.getElementById("score").innerText = `Plants collected: ${score}`;
        document.getElementById("info").innerText = "🌱 Plant collected!";
        setTimeout(() => {
          document.getElementById("info").innerText = "";
        }, 700);
      }
    }
  }

  // Star rating calculation (1 to 5 stars)
  function calculateStars() {
    let totalPoints = correctAnswers + score;
    const maxPoints = questions.length + questions.length * 2; // max plants could be ~2 per question roughly
    // Normalize and scale 1-5 stars
    let stars = Math.min(5, Math.floor((totalPoints / maxPoints) * 5));
    if (stars < 1) stars = 1;
    return stars;
  }

  function createStarsElement(numStars) {
    let starsStr = "";
    for (let i = 0; i < numStars; i++) {
      starsStr += "⭐";
    }
    return `<div class="stars" aria-label="${numStars} star${numStars > 1 ? "s" : ""}">${starsStr}</div>`;
  }

  function finishQuiz() {
    let pass = correctAnswers >= Math.ceil(questions.length / 2);
    let popupHolder = document.getElementById("popup-holder");
    popupHolder.innerHTML = "";
    let div = document.createElement("div");
    div.className = "popup-bg";
    let popup = document.createElement("div");
    popup.className = "popup";

    let stars = calculateStars();
    let starsHtml = createStarsElement(stars);

    if (pass) {
      flashColors();
      popup.innerHTML = `
        <h2>🎉 Congratulations!</h2>
        <div>You passed the quiz.<br/>
        Correct Answers: ${correctAnswers} / ${questions.length}<br/>
        Plants collected: ${score}<br/>
        ${starsHtml}
        </div>
        <div class="buttons">
          <button class="nextBtn">Next</button>
          <button class="fail retryBtn">Retry</button>
        </div>
      `;
    } else {
      popup.innerHTML = `
        <h2 style="color:#ce2d2d;">Try Again!</h2>
        <div>You answered only ${correctAnswers} of ${questions.length} correctly.<br/>
        Collect more plants by retrying.<br/>
        ${starsHtml}
        </div>
        <div class="buttons">
          <button class="nextBtn">Next</button>
          <button class="fail retryBtn">Retry</button>
        </div>
      `;
    }

    // Add golden sparkle background on popup
    let sparkleDiv = document.createElement("div");
    sparkleDiv.className = "golden-sparkle";
    popup.appendChild(sparkleDiv);

    div.appendChild(popup);
    popupHolder.appendChild(div);

    popup.querySelector(".nextBtn").onclick = () => {
      popupHolder.innerHTML = "";
      resetQuiz();
    };
    popup.querySelector(".retryBtn").onclick = () => {
      popupHolder.innerHTML = "";
      resetQuiz(true);
    };
  }

  // Flashing background colors celebration
  function flashColors() {
    let flashes = 0;
    const colors = ["#fff7a3", "#ffe766", "#ffcc00", "#ffdb4d", "#fff59d"];
    let interval = setInterval(() => {
      document.body.style.background = colors[flashes % colors.length];
      flashes++;
      if (flashes > 8) {
        clearInterval(interval);
        document.body.style.background =
          "linear-gradient(to bottom right, #eafdff 40%, #d2ffc4 100%)";
      }
    }, 180);
  }

  function resetQuiz(clearPlants = false) {
    currentQuestion = 0;
    correctAnswers = 0;
    if (clearPlants) {
      plants = [];
      farmer = { x: 25, y: 25, size: 36, speed: 18 };
      score = 0;
      document.getElementById("score").innerText = "Plants collected: 0";
      drawFarm();
    }
    showQuestion();
    document.getElementById("info").innerText = "";
    document.getElementById("result").innerText = "";
  }

  document.addEventListener("keydown", moveFarmer);
  drawFarm();
  (async () => {
    try {
      await loadDynamicQuestions();
    } catch (e) {
      console.error(e);
      questions = [];
    }
    if (!questions.length) {
      document.getElementById('question').innerText = 'No questions found for your grade/subject.';
      document.getElementById('options').innerHTML = '';
      document.getElementById('timer').innerText = '';
    } else {
      showQuestion();
    }
  })();
</script>

</body>
</html>
