<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Race Quiz Game</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #game-root { height: 100%; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="game-root">Loading game…</div>
    <script src="/games/shared-questions.js"></script>
    <script>
      (function() {
        const params = new URLSearchParams(location.search);
        const grade = params.get('grade');
        const subject = params.get('subject');
        const chapter = params.get('chapter');

        // Make questions global if game engine expects it
        window.questions = [];

        async function loadQuestions() {
          try {
            if (window.GameQuizLoader) {
              const normalizedQuestions = await window.GameQuizLoader.loadQuestions();
              window.questions = window.GameQuizLoader.toCarFormat(normalizedQuestions);
            } else {
              // Fallback to direct loading
              const res = await fetch('/games/Questions.json', { cache: 'no-store' });
              if (!res.ok) throw new Error('Failed to load Questions.json');
              const data = await res.json();
              
              // Filter questions by grade and subject
              const g = String(grade || '6');
              const s = (subject || '').toLowerCase();
              
              let questions = [];
              if (data.questions_by_grade && data.questions_by_grade[g] && data.questions_by_grade[g][subject]) {
                if (chapter && data.questions_by_grade[g][subject][chapter]) {
                  questions = data.questions_by_grade[g][subject][chapter];
                } else {
                  // Get all chapters for the subject
                  Object.keys(data.questions_by_grade[g][subject]).forEach(chapterKey => {
                    if (Array.isArray(data.questions_by_grade[g][subject][chapterKey])) {
                      questions.push(...data.questions_by_grade[g][subject][chapterKey]);
                    }
                  });
                }
              }
              
              window.questions = questions.map(q => ({
                question: q.text,
                options: q.choices,
                answer: q.answerIndex
              }));
            }
          } catch (e) {
            console.error(e);
            window.questions = [];
          }
        }

        function resetGame() {
          const root = document.getElementById('game-root');
          if (!window.questions.length) {
            root.textContent = 'No questions available for this selection.';
            return;
          }
          root.innerHTML = '';
          const title = document.createElement('h2');
          let titleText = `Car Race Quiz - ${subject} (Grade ${grade})`;
          if (chapter) {
            titleText += ` - ${chapter}`;
          }
          title.textContent = titleText;
          root.appendChild(title);
          const p = document.createElement('p');
          p.textContent = `Loaded ${window.questions.length} questions. Integrate with game engine here.`;
          root.appendChild(p);
        }

        (async () => {
          await loadQuestions();
          resetGame();
        })();
      })();
    </script>
  </body>
  </html>

<style>

  #startLine {

  #car {

  #popup-bg {

  }

  #popup {
    background: #fff7e6;

  }

  #popup h2 {
    color: #b8860b;

    text-shadow: 0 0 6px #f4d03f;
  }

  #popup .stars {
    font-size: 2.4rem;
    color: gold;
    margin-bottom: 20px;
  }

  #popup button {
    background-color: #f39c12;

    font-size: 1.1rem;
    margin: 10px;

  #popup button:hover {

</style>
</head>
<body>

<div class="container">
  <div id="timeBarContainer"><div id="timeBar"></div></div>
  <div id="question">Loading question...</div>
  <div id="options"></div>
  <div id="result"></div>
  <div id="carGame">
    <div id="track"></div>
    <div id="startLine" title="Start Line"></div>
    <div id="finishLine" title="Finish Line"></div>
    <div id="car"></div>
  </div>
</div>
<!-- Difficulty indicator will be added dynamically -->

<div id="popup-bg" style="display:none;">
  <div id="popup">
    <h2 id="popup-title"></h2>
    <div id="popup-stars" class="stars"></div>
    <div id="popup-text" style="margin-bottom:20px;"></div>
    <button id="retryBtn">Retry</button>
    <button id="nextBtn">Next</button>
  </div>
</div>

<script src="/games/shared-questions.js"></script>
<script>
  // Load questions dynamically using shared loader
  let questions = [];
  let normalized = [];
  let allNormalized = []; // Store all questions for dynamic filtering
  let currentDifficulty = null; // Current difficulty level (0-1)
  let consecutiveCorrect = 0;
  let consecutiveIncorrect = 0;

  function mapQuestions(raw) {
    return (Array.isArray(raw) ? raw : []).map((q) => ({
      question: q.text || q.question,
      options: q.choices || q.options || [],
      answer: typeof q.answerIndex === 'number' ? q.answerIndex : q.answer
    }));
  }

  async function ensureQuestionsLoaded() {
    try {
      const params = window.GameQuizLoader.parseParams();
      // Fetch recommended difficulty before loading questions
      const recommendedDifficulty = await window.GameQuizLoader.fetchRecommendedDifficulty(params.subject);
      currentDifficulty = recommendedDifficulty;
      
      // Load all questions first
      allNormalized = await window.GameQuizLoader.loadQuestions(params, null); // Load all without filtering
      
      // Then filter by difficulty
      if (currentDifficulty !== null) {
        const filtered = window.GameQuizLoader.filterByDifficulty(allNormalized, currentDifficulty, 0.2);
        normalized = filtered.length > 0 ? filtered : allNormalized; // Fallback to all if filtered is empty
      } else {
        normalized = allNormalized;
      }
      
      questions = window.GameQuizLoader.toCarFormat(normalized);
      
      // Update difficulty indicator
      updateDifficultyIndicator();
    } catch {
      questions = [];
      normalized = [];
      allNormalized = [];
    }
  }

  function updateDifficultyIndicator() {
    let indicator = document.getElementById('difficulty-indicator');
    if (!indicator) {
      // Create difficulty indicator if it doesn't exist
      indicator = document.createElement('div');
      indicator.id = 'difficulty-indicator';
      indicator.style.cssText = 'position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; z-index: 1000;';
      document.body.appendChild(indicator);
    }
    
    if (currentDifficulty === null) {
      indicator.textContent = 'Difficulty: Medium';
      indicator.style.background = 'rgba(255, 193, 7, 0.9)';
      return;
    }
    
    let label, color;
    if (currentDifficulty < 0.4) {
      label = 'Easy';
      color = 'rgba(40, 167, 69, 0.9)'; // Green
    } else if (currentDifficulty < 0.7) {
      label = 'Medium';
      color = 'rgba(255, 193, 7, 0.9)'; // Yellow
    } else {
      label = 'Hard';
      color = 'rgba(220, 53, 69, 0.9)'; // Red
    }
    
    indicator.textContent = `Difficulty: ${label}`;
    indicator.style.background = color;
  }

  function adjustDifficulty(isCorrect) {
    if (isCorrect) {
      consecutiveCorrect++;
      consecutiveIncorrect = 0;
      
      // If 3 correct in a row, increase difficulty
      if (consecutiveCorrect >= 3 && currentDifficulty !== null) {
        currentDifficulty = Math.min(1.0, currentDifficulty + 0.1);
        consecutiveCorrect = 0; // Reset counter
        filterQuestionsByDifficulty();
        updateDifficultyIndicator();
      }
    } else {
      consecutiveIncorrect++;
      consecutiveCorrect = 0;
      
      // If 2 wrong in a row, decrease difficulty
      if (consecutiveIncorrect >= 2 && currentDifficulty !== null) {
        currentDifficulty = Math.max(0.0, currentDifficulty - 0.1);
        consecutiveIncorrect = 0; // Reset counter
        filterQuestionsByDifficulty();
        updateDifficultyIndicator();
      }
    }
  }

  function filterQuestionsByDifficulty() {
    if (currentDifficulty === null || allNormalized.length === 0) return;
    
    // Filter available questions by current difficulty
    const filtered = window.GameQuizLoader.filterByDifficulty(allNormalized, currentDifficulty, 0.2);
    
    if (filtered.length > 0) {
      // Rebuild normalized and questions arrays
      normalized = filtered;
      questions = window.GameQuizLoader.toCarFormat(normalized);
      
      // If current question index is beyond filtered length, reset to 0
      if (currentQuestion >= questions.length) {
        currentQuestion = 0;
      }
    }
  }

  let currentQuestion=0;
  const maxTime=16;
  let timeLeft=maxTime;
  let timerInterval;
  let correctCount=0;
  let answerHistory = []; // Track all answers for feedback
  let questionStartTime = 0; // Track when each question starts

  const car=document.getElementById('car');
  const carGame=document.getElementById('carGame');
  const startLine=document.getElementById('startLine');
  const finishLine=document.getElementById('finishLine');

  const timeBar=document.getElementById('timeBar');
  const questionElem=document.getElementById('question');
  const optionsElem=document.getElementById('options');
  const resultElem=document.getElementById('result');

  const popupBg=document.getElementById('popup-bg');
  const popupTitle=document.getElementById('popup-title');
  const popupStars=document.getElementById('popup-stars');
  const popupText=document.getElementById('popup-text');
  const retryBtn=document.getElementById('retryBtn');
  const nextBtn=document.getElementById('nextBtn');

  const btnColors=['red','blue','green','orange','purple'];

  let carPos=0;
  const moveDist=100;

  function getStartLinePosition(){
    return startLine.offsetLeft + startLine.offsetWidth;
  }
  function getFinishLinePosition(){
    return finishLine.offsetLeft - car.offsetWidth;
  }
  function hasCrossedStartLine(){
    return carPos <= getStartLinePosition();
  }
  function hasCrossedFinishLine(){
    return carPos >= getFinishLinePosition();
  }

  function startTimer(){
    timeLeft=maxTime;
    updateTimeBar();
    timerInterval=setInterval(()=>{
      timeLeft-=0.1;
      updateTimeBar();
      if(timeLeft<=0){
        clearInterval(timerInterval);
        timeLeft=0;
        timeOut();
      }
    },100);
  }

  function updateTimeBar(){
    const perc=(timeLeft/maxTime)*100;
    timeBar.style.width=perc+'%';
    if(perc<30) timeBar.style.background='#e74c3c';
    else if(perc<60) timeBar.style.background='#f39c12';
    else timeBar.style.background='#27ae60';
  }

  function loadQuestion(){
    if(currentQuestion>=questions.length){
      showPopup("Quiz Over", false);
      return;
    }
    questionStartTime = Date.now(); // Record question start time
    questionElem.textContent=`Q${currentQuestion+1}. ${questions[currentQuestion].question}`;
    optionsElem.innerHTML='';
    questions[currentQuestion].options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option ' + btnColors[idx % btnColors.length];
      btn.textContent = opt;
      btn.onclick=()=> selectAnswer(idx);
      optionsElem.appendChild(btn);
    });
    resultElem.textContent='';
    startTimer();
  }

  function selectAnswer(selectedIdx){
    clearInterval(timerInterval);
    const question = questions[currentQuestion];
    const normalizedQ = normalized[currentQuestion] || {};
    const correctIdx= question.answer;
    const isCorrect = selectedIdx === correctIdx;
    // Calculate time spent on this question (in seconds, convert to milliseconds)
    const timeSpent = questionStartTime > 0 
      ? Math.round((Date.now() - questionStartTime) / 1000) // Convert to seconds
      : Math.round((maxTime - timeLeft)); // Fallback: use time remaining
    
    // Adjust difficulty based on performance
    adjustDifficulty(isCorrect);
    
    // Track answer for feedback
    answerHistory.push({
      questionId: normalizedQ.id || `q${currentQuestion}`,
      isCorrect: isCorrect,
      conceptTags: normalizedQ.conceptTags || normalizedQ.concept_tags || [],
      timeSpent: timeSpent,
      errorType: isCorrect ? null : (normalizedQ.errorType || 'concept'), // Default to 'concept' if wrong
      studentAnswer: selectedIdx,
      correctAnswer: correctIdx
    });
    
    if(isCorrect){
      resultElem.textContent = "Correct! 🚗 Car moves forward!";
      moveCar(true);
      correctCount++;
    } else {
      const exp = normalizedQ.explanation || '';
      resultElem.textContent = exp ? `Incorrect! ${exp}` : "Incorrect! 🚗 Car moves backward!";
      moveCar(false);
    }
    Array.from(optionsElem.children).forEach(b=>b.disabled=true);
    currentQuestion++;

    setTimeout(()=>{
      if(hasCrossedStartLine()){
        showPopup("You crossed the start line moving backwards! Game Over.", true);
        return;
      }
      if(hasCrossedFinishLine()){
        showPopup("You reached the finish line! Perfect score!", false, true);
        return;
      }
      loadQuestion();
    }, 1600);
  }

  function timeOut(){
    // Track timeout as incorrect answer
    const question = questions[currentQuestion];
    const normalizedQ = normalized[currentQuestion] || {};
    const timeSpent = questionStartTime > 0 
      ? Math.round((Date.now() - questionStartTime) / 1000)
      : maxTime;
    
    // Adjust difficulty (timeout counts as incorrect)
    adjustDifficulty(false);
    
    answerHistory.push({
      questionId: normalizedQ.id || `q${currentQuestion}`,
      isCorrect: false,
      conceptTags: normalizedQ.conceptTags || normalizedQ.concept_tags || [],
      timeSpent: timeSpent,
      errorType: 'careless', // Timeout is typically careless error
      studentAnswer: null,
      correctAnswer: question.answer
    });
    
    resultElem.textContent = "Time's up! 🚗 Car moves backward!";
    moveCar(false);
    Array.from(optionsElem.children).forEach(b=>b.disabled=true);
    currentQuestion++;
    setTimeout(()=>{
      if(hasCrossedStartLine()){
        showPopup("You crossed the start line moving backwards! Game Over.", true);
        return;
      }
      if(hasCrossedFinishLine()){
        showPopup("You reached the finish line! Perfect score!", false, true);
        return;
      }
      loadQuestion();
    }, 1600);
  }

  function moveCar(forward){
    if(forward){
      carPos += moveDist;
      if(carPos > getFinishLinePosition()) carPos = getFinishLinePosition();
    } else {
      carPos -= moveDist;
      if(carPos < getStartLinePosition()) carPos = getStartLinePosition();
    }
    car.style.left = carPos + 'px';

    // Change track background to red if crossed start line (deadend)
    if(hasCrossedStartLine()){
      carGame.classList.add('deadend');
    } else {
      carGame.classList.remove('deadend');
    }
  }

  function calculateStars(){
    let stars = Math.round((correctCount/questions.length)*5);
    if(stars<1) stars=1;
    return stars;
  }

  function showPopup(title, isDeadEnd=false, perfect=false){
    popupBg.style.display='flex';
    popupTitle.textContent = title;
    let starsCount = perfect ? 5 : calculateStars();
    popupStars.textContent = "⭐".repeat(starsCount);
    if(isDeadEnd){
      popupText.innerHTML = "You moved back too much and crossed the start line.<br/>Try again with retry.";
    } else if(perfect){
      popupText.innerHTML = `You answered all questions correctly!<br/>Perfect score!`;
    } else {
      popupText.innerHTML = `You answered ${correctCount} of ${questions.length} correctly.<br/>Stars scored: ${starsCount} ${starsCount>1?'stars':'star'}!<br/>Use Retry to try again or Next to start fresh.`;
    }

    // Report score to backend (skip in demo/offline)
    try {
      const token = localStorage.getItem('stem_token');
      const urlParams = new URLSearchParams(window.location.search);
      const lessonId = urlParams.get('chapter') || urlParams.get('lessonId') || 'unknown';
      const timeSpent = Math.round((maxTime * questions.length) - (timeLeft));
      const quizId = `${lessonId}-${Date.now()}`;
      const score = Math.max(0, Math.round((correctCount / Math.max(1, questions.length)) * 100));
      if (token && token !== 'demo_token') {
        const score = Math.max(0, Math.round((correctCount / Math.max(1, questions.length)) * 100));
        fetch('/api/quiz-complete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ lessonId, score, timeSpent })
        }).catch(() => {});
        // Also store per-quiz progress row
        fetch('/api/progress', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ lessonId, quizId, score, completed: true })
        }).catch(() => {});
      } else {
        // Offline/demo fallback: persist locally so UI can reflect progress & points
        try {
          const keyPts = 'offline_points';
          const prev = Number(localStorage.getItem(keyPts) || '0');
          localStorage.setItem(keyPts, String(prev + score));
          // Track completed quiz ids per lesson
          const keySet = `offline_completed_${lessonId}`;
          const prevSetRaw = localStorage.getItem(keySet);
          const prevSet = prevSetRaw ? JSON.parse(prevSetRaw) : [];
          if (!prevSet.includes(quizId)) {
            prevSet.push(quizId);
            localStorage.setItem(keySet, JSON.stringify(prevSet));
          }
        } catch {}
      }
      // Notify app to refresh
      window.dispatchEvent(new CustomEvent('quiz:completed', { detail: { lessonId, score } }));
      
      // Send detailed quiz results to parent via postMessage
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('chapter') || urlParams.get('lessonId') || 'unknown';
        const quizId = `${lessonId}-${Date.now()}`;
        const totalTimeSpent = Math.round((maxTime * questions.length) - (timeLeft));
        
        // Send detailed results to parent window
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'quiz-complete',
            results: {
              quizId: quizId,
              answers: answerHistory,
              lessonId: lessonId,
              totalTimeSpent: totalTimeSpent
            }
          }, window.location.origin);
        }
      } catch (e) {
        console.error('Error sending quiz results:', e);
      }
    } catch {}
  }

  retryBtn.onclick = () => {
    popupBg.style.display = 'none';
    resetGame();
  };
  nextBtn.onclick = () => {
    popupBg.style.display = 'none';
    resetGame();
  };

  function resetGame(){
    currentQuestion=0;
    correctCount=0;
    answerHistory = []; // Reset answer history
    consecutiveCorrect = 0; // Reset consecutive counters
    consecutiveIncorrect = 0;
    // Reset difficulty to initial recommended difficulty
    (async () => {
      const params = window.GameQuizLoader.parseParams();
      const recommendedDifficulty = await window.GameQuizLoader.fetchRecommendedDifficulty(params.subject);
      if (recommendedDifficulty !== null) {
        currentDifficulty = recommendedDifficulty;
        filterQuestionsByDifficulty();
        updateDifficultyIndicator();
      }
    })();
    carPos=getStartLinePosition();
    car.style.left=carPos+'px';
    carGame.classList.remove('deadend');
    loadQuestion();
  }

  window.onload = async () => {
    await ensureQuestionsLoaded();
    carPos = getStartLinePosition();
    car.style.left = carPos + 'px';
    if (!questions.length) {
      document.getElementById('question').textContent = 'No questions available for this selection.';
      return;
    }
    loadQuestion();
  }
</script>

</body>
</html>
