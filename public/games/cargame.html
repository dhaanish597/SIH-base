<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Race Quiz Game</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #game-root { height: 100%; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="game-root">Loading game…</div>
    <script>
      (function() {
        const params = new URLSearchParams(location.search);
        const grade = params.get('grade');
        const subject = params.get('subject');

        // Make questions global if game engine expects it
        window.questions = [];

        async function loadQuestions() {
          try {
            const res = await fetch(`/api/quizzes?grade=${encodeURIComponent(grade || '')}&subject=${encodeURIComponent(subject || '')}`);
            if (!res.ok) throw new Error('Failed to fetch questions');
            window.questions = await res.json();
          } catch (e) {
            console.error(e);
            window.questions = [];
          }
        }

        function resetGame() {
          const root = document.getElementById('game-root');
          if (!window.questions.length) {
            root.textContent = 'No questions available for this selection.';
            return;
          }
          root.innerHTML = '';
          const title = document.createElement('h2');
          title.textContent = `Car Race Quiz - ${subject} (Grade ${grade})`;
          root.appendChild(title);
          const p = document.createElement('p');
          p.textContent = `Loaded ${window.questions.length} questions. Integrate with game engine here.`;
          root.appendChild(p);
        }

        (async () => {
          await loadQuestions();
          resetGame();
        })();
      })();
    </script>
  </body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MCQ Quiz with Car Race and Start/Finish Lines</title>
<style>
  :root {
    --car-svg: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMCIgaGVpZ2h0PSIxNSIgdmlld0JveD0iMCAwIDMwIDE1Ij48cmVjdCB3aWR0aD0iMzAiIGhlaWdodD0iMTUiIGZpbGw9IiNmZjYwNjAiIHJ4PSIzIi8+PGNpcmNsZSBjeD0iNyIgY3k9IjEyIiByPSIyIiBmaWxsPSIjZDAwIi8+PGNpcmNsZSBjeD0iMjMiIGN5PSIxMiIgcj0iMiIgZmlsbD0iI2QwMCIvPjwvc3ZnPg==");
  }

  body {
    margin: 0; padding: 0;
    background-color: #003366;
    background-image: var(--car-svg);
    background-repeat: repeat;
    background-size: 60px 30px;
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #222;
    overflow-x: hidden;
  }

  .container {
    max-width: 900px;
    margin: 20px auto 40px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 12px;
    box-shadow: 0 8px 20px rgb(0 0 0 / 0.15);
    padding: 20px 30px 30px;
    position: relative;
    z-index: 1;
  }

  #timeBarContainer {
    position: relative;
    height: 24px;
    background: #eee;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  #timeBar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 100%;
    background: linear-gradient(90deg, #4caf50, #087f23);
    transition: width 0.1s linear;
  }

  #question {
    font-size: 1.35rem;
    color: #025;
    margin-bottom: 18px;
    min-height: 70px;
  }

  #options {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 25px;
  }

  button.option {
    flex: 1 1 calc(50% - 16px);
    padding: 14px 18px;
    font-size: 1.1rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    color: white;
    box-shadow: 0 4px 8px rgb(0 0 0 / 0.1);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    user-select: none;
  }

  button.option:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 16px rgb(0 0 0 / 0.2);
  }

  button.option.red { background-color: #e74c3c; }
  button.option.blue { background-color: #3498db; }
  button.option.green { background-color: #27ae60; }
  button.option.orange { background-color: #f39c12; }
  button.option.purple { background-color: #9b59b6; }

  #result {
    font-size: 1.18rem;
    font-weight: 600;
    height: 32px;
    margin-bottom: 24px;
    color: #208020;
  }

  #carGame {
    position: relative;
    width: 100%;
    height: 120px;
    border: 2px solid #444;
    border-radius: 18px;
    background: linear-gradient(90deg, #a2bed8, #1d4883);
    overflow: hidden;
    margin-bottom: 30px;
    transition: background 0.5s ease;
  }

  #carGame.deadend {
    background: linear-gradient(90deg, #a23124, #7a1b16);
    border-color: #901917;
  }

  #track {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      #ddd,
      #ddd 10px,
      #999 10px,
      #999 15px
    );
    border-radius: 4px;
  }

  #startLine {
    position: absolute;
    bottom: 10px;
    left: 10px;
    width: 8px;
    height: 48px;
    background: repeating-conic-gradient(#000 0deg 45deg, #fff 45deg 90deg);
    box-shadow: 0 0 12px 2px #1a1a1a;
    border-radius: 2px;
    z-index: 10;
  }

  #finishLine {
    position: absolute;
    bottom: 10px;
    right: 18px;
    width: 8px;
    height: 48px;
    background: repeating-conic-gradient(#fff 0deg 45deg, #000 45deg 90deg);
    box-shadow: 0 0 12px 2px #ffd700;
    border-radius: 2px;
    z-index: 10;
  }

  #car {
    position: absolute;
    bottom: 26px;
    width: 80px;
    height: 40px;
    background: #e84118;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgb(0 0 0 / 0.4);
    left: 0;
    transition: left 0.5s ease;
  }

  #car:before {
    content: "";
    position: absolute;
    top: 8px; left: 12px; width: 22px; height: 24px;
    background: #fff;
    border-radius: 4px 0 0 4px;
  }

  #car:after {
    content: "";
    position: absolute;
    top: 18px; right: 12px; width: 12px; height: 13px;
    background: #222;
    border-radius: 3px;
  }

  #popup-bg {
    position: fixed;
    top: 0; left: 0; right:0; bottom:0;
    background: rgba(0,0,0,0.4);
    z-index: 20;
    display: none;
    justify-content: center;
    align-items: center;
  }

  #popup {
    background: #fff7e6;
    border-radius: 16px;
    padding: 30px 40px;
    box-shadow: 0 0 24px #f1c40faa inset, 0 0 30px #f4d03f;
    text-align: center;
    max-width: 380px;
  }

  #popup h2 {
    color: #b8860b;
    margin-bottom: 12px;
    font-size: 2rem;
    text-shadow: 0 0 6px #f4d03f;
  }

  #popup .stars {
    font-size: 2.4rem;
    color: gold;
    margin-bottom: 20px;
  }

  #popup button {
    background-color: #f39c12;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-weight: 700;
    font-size: 1.1rem;
    margin: 10px;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 0 14px #d67e00aa;
    transition: background-color 0.22s ease;
  }

  #popup button:hover {
    background-color: #d67e00;
  }
</style>
</head>
<body>

<div class="container">
  <div id="timeBarContainer"><div id="timeBar"></div></div>
  <div id="question">Loading question...</div>
  <div id="options"></div>
  <div id="result"></div>
  <div id="carGame">
    <div id="track"></div>
    <div id="startLine" title="Start Line"></div>
    <div id="finishLine" title="Finish Line"></div>
    <div id="car"></div>
  </div>
</div>

<div id="popup-bg" style="display:none;">
  <div id="popup">
    <h2 id="popup-title"></h2>
    <div id="popup-stars" class="stars"></div>
    <div id="popup-text" style="margin-bottom:20px;"></div>
    <button id="retryBtn">Retry</button>
    <button id="nextBtn">Next</button>
  </div>
</div>

<script src="/games/shared-questions.js"></script>
<script>
  // Load questions dynamically using shared loader
  let questions = [];
  let normalized = [];

  function mapQuestions(raw) {
    return (Array.isArray(raw) ? raw : []).map((q) => ({
      question: q.text || q.question,
      options: q.choices || q.options || [],
      answer: typeof q.answerIndex === 'number' ? q.answerIndex : q.answer
    }));
  }

  async function ensureQuestionsLoaded() {
    try {
      normalized = await window.GameQuizLoader.loadQuestions();
      questions = window.GameQuizLoader.toCarFormat(normalized);
    } catch {
      questions = [];
      normalized = [];
    }
  }

  let currentQuestion=0;
  const maxTime=16;
  let timeLeft=maxTime;
  let timerInterval;
  let correctCount=0;

  const car=document.getElementById('car');
  const carGame=document.getElementById('carGame');
  const startLine=document.getElementById('startLine');
  const finishLine=document.getElementById('finishLine');

  const timeBar=document.getElementById('timeBar');
  const questionElem=document.getElementById('question');
  const optionsElem=document.getElementById('options');
  const resultElem=document.getElementById('result');

  const popupBg=document.getElementById('popup-bg');
  const popupTitle=document.getElementById('popup-title');
  const popupStars=document.getElementById('popup-stars');
  const popupText=document.getElementById('popup-text');
  const retryBtn=document.getElementById('retryBtn');
  const nextBtn=document.getElementById('nextBtn');

  const btnColors=['red','blue','green','orange','purple'];

  let carPos=0;
  const moveDist=100;

  function getStartLinePosition(){
    return startLine.offsetLeft + startLine.offsetWidth;
  }
  function getFinishLinePosition(){
    return finishLine.offsetLeft - car.offsetWidth;
  }
  function hasCrossedStartLine(){
    return carPos <= getStartLinePosition();
  }
  function hasCrossedFinishLine(){
    return carPos >= getFinishLinePosition();
  }

  function startTimer(){
    timeLeft=maxTime;
    updateTimeBar();
    timerInterval=setInterval(()=>{
      timeLeft-=0.1;
      updateTimeBar();
      if(timeLeft<=0){
        clearInterval(timerInterval);
        timeLeft=0;
        timeOut();
      }
    },100);
  }

  function updateTimeBar(){
    const perc=(timeLeft/maxTime)*100;
    timeBar.style.width=perc+'%';
    if(perc<30) timeBar.style.background='#e74c3c';
    else if(perc<60) timeBar.style.background='#f39c12';
    else timeBar.style.background='#27ae60';
  }

  function loadQuestion(){
    if(currentQuestion>=questions.length){
      showPopup("Quiz Over", false);
      return;
    }
    questionElem.textContent=`Q${currentQuestion+1}. ${questions[currentQuestion].question}`;
    optionsElem.innerHTML='';
    questions[currentQuestion].options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option ' + btnColors[idx % btnColors.length];
      btn.textContent = opt;
      btn.onclick=()=> selectAnswer(idx);
      optionsElem.appendChild(btn);
    });
    resultElem.textContent='';
    startTimer();
  }

  function selectAnswer(selectedIdx){
    clearInterval(timerInterval);
    const correctIdx= questions[currentQuestion].answer;
    if(selectedIdx===correctIdx){
      resultElem.textContent = "Correct! 🚗 Car moves forward!";
      moveCar(true);
      correctCount++;
    } else {
      const exp = (normalized[currentQuestion] && normalized[currentQuestion].explanation) || '';
      resultElem.textContent = exp ? `Incorrect! ${exp}` : "Incorrect! 🚗 Car moves backward!";
      moveCar(false);
    }
    Array.from(optionsElem.children).forEach(b=>b.disabled=true);
    currentQuestion++;

    setTimeout(()=>{
      if(hasCrossedStartLine()){
        showPopup("You crossed the start line moving backwards! Game Over.", true);
        return;
      }
      if(hasCrossedFinishLine()){
        showPopup("You reached the finish line! Perfect score!", false, true);
        return;
      }
      loadQuestion();
    }, 1600);
  }

  function timeOut(){
    resultElem.textContent = "Time's up! 🚗 Car moves backward!";
    moveCar(false);
    Array.from(optionsElem.children).forEach(b=>b.disabled=true);
    currentQuestion++;
    setTimeout(()=>{
      if(hasCrossedStartLine()){
        showPopup("You crossed the start line moving backwards! Game Over.", true);
        return;
      }
      if(hasCrossedFinishLine()){
        showPopup("You reached the finish line! Perfect score!", false, true);
        return;
      }
      loadQuestion();
    }, 1600);
  }

  function moveCar(forward){
    if(forward){
      carPos += moveDist;
      if(carPos > getFinishLinePosition()) carPos = getFinishLinePosition();
    } else {
      carPos -= moveDist;
      if(carPos < getStartLinePosition()) carPos = getStartLinePosition();
    }
    car.style.left = carPos + 'px';

    // Change track background to red if crossed start line (deadend)
    if(hasCrossedStartLine()){
      carGame.classList.add('deadend');
    } else {
      carGame.classList.remove('deadend');
    }
  }

  function calculateStars(){
    let stars = Math.round((correctCount/questions.length)*5);
    if(stars<1) stars=1;
    return stars;
  }

  function showPopup(title, isDeadEnd=false, perfect=false){
    popupBg.style.display='flex';
    popupTitle.textContent = title;
    let starsCount = perfect ? 5 : calculateStars();
    popupStars.textContent = "⭐".repeat(starsCount);
    if(isDeadEnd){
      popupText.innerHTML = "You moved back too much and crossed the start line.<br/>Try again with retry.";
    } else if(perfect){
      popupText.innerHTML = `You answered all questions correctly!<br/>Perfect score!`;
    } else {
      popupText.innerHTML = `You answered ${correctCount} of ${questions.length} correctly.<br/>Stars scored: ${starsCount} ${starsCount>1?'stars':'star'}!<br/>Use Retry to try again or Next to start fresh.`;
    }
  }

  retryBtn.onclick = () => {
    popupBg.style.display = 'none';
    resetGame();
  };
  nextBtn.onclick = () => {
    popupBg.style.display = 'none';
    resetGame();
  };

  function resetGame(){
    currentQuestion=0;
    correctCount=0;
    carPos=getStartLinePosition();
    car.style.left=carPos+'px';
    carGame.classList.remove('deadend');
    loadQuestion();
  }

  window.onload = async () => {
    await ensureQuestionsLoaded();
    carPos = getStartLinePosition();
    car.style.left = carPos + 'px';
    if (!questions.length) {
      document.getElementById('question').textContent = 'No questions available for this selection.';
      return;
    }
    loadQuestion();
  }
</script>

</body>
</html>
