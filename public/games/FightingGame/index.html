<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fighting Game</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #game-root { height: 100%; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="game-root">Loading game…</div>
    <script src="/games/shared-questions.js"></script>
    <script>
      (function() {
        const { grade, subject } = window.GameQuizLoader.parseParams();
        let normalized = [];

        async function loadQuestions() {
          try {
            normalized = await window.GameQuizLoader.loadQuestions({ grade, subject });
            // Adapt into the format main.js expects (q/options/answer)
            window.questions = window.GameQuizLoader.toFightingFormat(normalized);
          } catch (e) {
            console.error(e);
            normalized = [];
            window.questions = [];
          }
        }

        function resetGame() {
          const root = document.getElementById('game-root');
          if (!normalized.length) {
            root.textContent = 'No questions available for this selection.';
            return;
          }
          root.innerHTML = '';
          const title = document.createElement('h2');
          title.textContent = `Fighting Game - ${subject} (Grade ${grade})`;
          root.appendChild(title);
          const p = document.createElement('p');
          p.textContent = `Loaded ${normalized.length} questions. Press Space in game to get a question.`;
          root.appendChild(p);
        }

        (async () => {
          await loadQuestions();
          resetGame();
        })();
      })();
    </script>
  </body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Fighting game</title>
    <style>
      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* Kaboom creates a canvas with id "kaboom" by default */
      canvas, #kaboom {
        width: 100% !important;
        height: 100% !important;
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
</head>
<body>
    <script src="https://unpkg.com/kaboom@3000.0.0-beta.2/dist/kaboom.js"></script>
    <script src="./main.js"></script>
</body>
</html>
