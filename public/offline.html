<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEM Learn - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .offline-content {
      max-width: 400px;
    }
    h1 { margin-bottom: 20px; }
    .icon { font-size: 4rem; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="offline-content">
    <div class="icon">📚</div>
    <h1>You're Offline</h1>
    <p>Don't worry! You can continue learning with your downloaded lessons and quizzes.</p>
    <p>Your progress will sync automatically when you're back online.</p>
  </div>
</body>
</html>
