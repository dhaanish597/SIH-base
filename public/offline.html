<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f8fafc; color: #111827; }
      .container { max-width: 640px; margin: 20vh auto; padding: 24px; text-align: center; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
      .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
      .subtitle { color: #6b7280; margin-bottom: 16px; }
      .btn { display: inline-block; background: #4f46e5; color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="title">You are offline</div>
        <div class="subtitle">Some features may be unavailable. We'll sync when back online.</div>
        <a class="btn" href="/">Try Again</a>
      </div>
    </div>
  </body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEM Learn - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .offline-content {
      max-width: 400px;
    }
    h1 { margin-bottom: 20px; }
    .icon { font-size: 4rem; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="offline-content">
    <div class="icon">📚</div>
    <h1>You're Offline</h1>
    <p>Don't worry! You can continue learning with your downloaded lessons and quizzes.</p>
    <p>Your progress will sync automatically when you're back online.</p>
  </div>
</body>
</html>
