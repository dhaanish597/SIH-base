<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Measurement of Length and Motion - Interactive Learning</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    display: flex;
    height: 100vh;
    background: #f9fbfc;
    color: #2c3e50;
    overflow: hidden;
  }
  #sidebar {
    width: 300px;
    background: #2980b9;
    color: white;
    box-shadow: 3px 0 6px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    padding: 20px 15px;
    box-sizing: border-box;
    user-select: none;
  }
  #sidebar h2 {
    font-weight: 700;
    font-size: 1.5rem;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(255,255,255,0.3);
    margin-bottom: 20px;
    text-align: center;
  }
  #conceptList {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex-grow: 1;
  }
  #conceptList li {
    display: flex;
    justify-content: space-between;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1.3;
    transition: background 0.3s, color 0.25s;
  }
  #conceptList li:hover, #conceptList li.active {
    background: #1b4f72;
    font-weight: 600;
  }
  .tick {
    font-weight: 700;
    font-size: 1.2rem;
    color: #2ecc71;
    visibility: hidden;
  }
  .tick.completed {
    visibility: visible;
  }
  #main {
    flex-grow: 1;
    background: white;
    padding: 40px 50px;
    overflow-y: auto;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  #slideTitle {
    color: #2471a3;
    font-size: 2.25rem;
    font-weight: 700;
    margin-bottom: 15px;
  }
  #slideImage {
    max-height: 280px;
    margin-bottom: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 15px rgba(36, 113, 163, 0.15);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #slideImage img {
    max-width: 100%;
    max-height: 280px;
    object-fit: contain;
  }
  #slideContent {
    font-size: 1.15rem;
    line-height: 1.7;
    color: #34495e;
    white-space: pre-wrap;
  }
  #slideContent ul {
    margin-top: 10px;
    margin-left: 20px;
    list-style-type: disc;
    color: #2c3e50;
  }
  #slideContent ul li {
    margin-bottom: 8px;
  }
  #navButtons {
    margin-top: auto;
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
  }
  button {
    background-color: #2980b9;
    border: none;
    color: white;
    padding: 14px 30px;
    font-weight: 600;
    font-size: 1.1rem;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
  }
  button:disabled {
    background-color: #7fb3d5;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    background-color: #1b4f72;
  }
  /* Scrollbar for sidebar */
  #conceptList::-webkit-scrollbar {
    width: 8px;
  }
  #conceptList::-webkit-scrollbar-track {
    background: #21618c;
    border-radius: 10px;
  }
  #conceptList::-webkit-scrollbar-thumb {
    background-color: #1b4f72;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <nav id="sidebar" aria-label="Concepts Navigation">
    <h2>Chapter Concepts</h2>
    <ul id="conceptList" role="list"></ul>
  </nav>

  <main id="main" role="main" tabindex="0" aria-live="polite" aria-atomic="true">
    <h1 id="slideTitle"></h1>
    <div id="slideImage" aria-label="Concept illustration"></div>
    <section id="slideContent"></section>

    <div id="navButtons" role="navigation" aria-label="Slide navigation buttons">
      <button id="prevBtn" aria-label="Previous slide">&larr; Previous</button>
      <button id="nextBtn" aria-label="Next slide">Next &rarr;</button>
    </div>
  </main>

<script>
  const slides = [
    {
      title: "Introduction to Measurement of Length and Motion",
      content: `Meet Deepa, an 11-year-old girl who needs a new school uniform because she has grown taller. Her mother asks for a two-metre cloth piece measured by the shopkeeper using a metal rod. The tailor uses a flexible tape to measure Deepa, adding "char angula" (four finger widths) for extra length.

This simple experience shows us how people have measured lengths using different tools and body parts.

Key points:
- Traditional measurements used body parts like handspan, feet, or strides.
- Measurement varies between people unless standardized units are used.
- The need for fixed units of measurement arose for consistent results.`,
      image: "https://upload.wikimedia.org/wikipedia/commons/8/87/Tailor_measures_cloth_in_Bangladesh%2C_2011_%281%29.jpg",
      alt: "Tailor measuring cloth with tape"
    },
    {
      title: "How Do We Measure Length?",
      content: `People measure length in many ways:
- Using body parts: handspan (balisht), foot length, arm's length, strides.
- Farmers measure fields by counting their walking strides.
- Variations occur because body sizes differ (see Table 5.1 on measuring a table with handspans).

This shows why body parts are unreliable as standard units.

Measurement always consists of two parts:
- A number (how many units)
- A unit (what type of unit)

Example: Length of table = 13 handspans`,
      image: "https://upload.wikimedia.org/wikipedia/commons/f/f2/Handspan_example.png",
      alt: "Handspan measurement demonstration"
    },
    {
      title: "History of Measurement Units in India",
      content: `India has a rich measuring system from ancient times:
- 'Angula' (finger width), 'dhanusa', and 'yojana' are traditional units mentioned in ancient texts.
- These were used in architecture, town planning, and crafting.
- Harappan excavations show scales with markings indicating early measurement tools.

Today, traditional measuring units sometimes co-exist with modern units in crafts.`,
      image: "https://upload.wikimedia.org/wikipedia/commons/3/38/Standard_measuring_instruments_2009_Aizawl_Mizoram.jpg",
      alt: "Traditional measuring scales from India"
    },
    {
      title: "Standard Units of Length (SI Units)",
      content: `To avoid confusion between different types of units, countries adopted the International System of Units (SI).

Main SI units of length:
- Metre (m): standard unit
- Centimetre (cm): 1 m = 100 cm
- Millimetre (mm): 1 cm = 10 mm
- Kilometre (km): 1 km = 1000 m

Older units like inch (2.54 cm) and foot are still used in some places.

The metre scale shows clear divisions:
- Full marks for centimetres
- Each cm subdivided into 10 millimetres for precise measurement`,
      image: "https://upload.wikimedia.org/wikipedia/commons/1/18/Metric_scale_on_bench_grinder.jpg",
      alt: "Metre scale showing cm and mm markings"
    },
    {
      title: "Correct Way of Measuring Length",
      content: `Proper measurement involves care:
- Place the scale directly along the object's length (avoid gaps).
- Position your eye directly above the scale mark where you read to avoid parallax error.
- Broken scales can still be used by measuring between two known markings and subtracting.

For curved or flexible objects (like fabric or tree girth), use flexible measuring tapes or threads.

Example steps:
1. Use the tape or thread to fit the curve.
2. Straighten the thread and measure length with scale.`,
      image: "https://upload.wikimedia.org/wikipedia/commons/e/ec/Measuring_how_to_use_a_ruler.png",
      alt: "Correct measuring technique with ruler"
    },
    {
      title: "Measuring Length of Curved Lines",
      content: `Curved objects like verandah arches or string lights require different measurement methods:

- Use a flexible tape which can bend along curves.
- Alternatively, place a thread along the curve and then straighten it to measure with a ruler.

This ensures accurate measurements even when the shape is not straight.`,
      image: "https://upload.wikimedia.org/wikipedia/commons/f/f6/Thread_wrapped_around_cylinder.jpg",
      alt: "Thread used for measuring curved length"
    },
    {
      title: "Describing Position and Reference Points",
      content: `Position of an object is always described relative to a fixed point — called the reference point.

Example:
- Distances like "Delhi 70 km" on kilometre stones show distance relative to Delhi.
- Different observers might report different distances unless they use the same reference point.

This is important to consistently describe locations and distances.

Reference points help in:
- Deciding if an object is near or far.
- Drawing maps or laying out courts (e.g., Kabaddi court lines from a start point).`,
      image: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Reference_point.svg",
      alt: "Illustration of reference point"
    },
    {
      title: "Understanding Motion",
      content: `An object is in motion if its position changes with respect to the reference point over time.

If position doesn't change, the object is at rest.

Example:
- Passengers inside a moving bus are at rest relative to bus seats.
- But relative to the road outside, they are in motion.

Thus, motion depends on the chosen reference point.`,
      image: "https://upload.wikimedia.org/wikipedia/commons/8/8f/Moving_car_on_road.jpg",
      alt: "Car moving on road illustrating motion"
    },
    {
      title: "Types of Motion",
      content: `Motion is classified based on the path of the object:

1. Linear Motion
- Movement along a straight line.
- Examples: A box sliding, a car on a straight road.

2. Circular Motion
- Movement along a circular path.
- Examples: A rotating merry-go-round, a whirling object on a string.

3. Oscillatory Motion
- Movement to and fro about a fixed point.
- Examples: Swinging of a pendulum, vibrating metal strip.

Both circular and oscillatory motions repeat periodically.`,
      image: "https://upload.wikimedia.org/wikipedia/commons/1/14/Oscillatory_motion.svg",
      alt: "Visual depiction of linear, circular, and oscillatory motion"
    },
    {
      title: "Summary and Exercises",
      content: `Key Takeaways:
- Measurement requires a number and a unit.
- Standard units like metre provide consistent measurement.
- Proper measuring techniques ensure accurate readings.
- Position is relative to a reference point.
- Motion is defined by changing position relative to a reference.

Suggested Activities:
- Measure lengths of household items using a scale.
- Compare body-based measures and standard units.
- Identify motion types around you.
- Convert distances between km, m, and cm.
- Explore traditional Indian units of measurement.

Engage with these exercises to strengthen your understanding of length and motion!`,
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Exercise_simple.svg/320px-Exercise_simple.svg.png",
      alt: "Exercises and activities"
    }
  ];

  const conceptList = document.getElementById('conceptList');
  const slideTitle = document.getElementById('slideTitle');
  const slideImage = document.getElementById('slideImage');
  const slideContent = document.getElementById('slideContent');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentSlide = 0;
  const completed = new Array(slides.length).fill(false);

  // Initialize sidebar with concepts
  slides.forEach((slide, index) => {
    const li = document.createElement('li');
    li.textContent = slide.title;
    li.setAttribute('data-index', index);
    li.setAttribute('role', 'listitem');
    const tick = document.createElement('span');
    tick.textContent = '✓';
    tick.className = 'tick';
    li.appendChild(tick);
    li.addEventListener('click', () => {
      saveCompletion(currentSlide);
      showSlide(index);
    });
    conceptList.appendChild(li);
  });

  function updateSidebar() {
    const items = conceptList.querySelectorAll('li');
    items.forEach((item, index) => {
      item.classList.toggle('active', index === currentSlide);
      const tick = item.querySelector('.tick');
      if (completed[index]) {
        tick.classList.add('completed');
      } else {
        tick.classList.remove('completed');
      }
    });
  }

  function saveCompletion(slideIndex) {
    completed[slideIndex] = true;
  }

  function showSlide(index) {
    if (index < 0 || index >= slides.length) return;
    currentSlide = index;
    saveCompletion(currentSlide);
    slideTitle.textContent = slides[index].title;

    slideImage.innerHTML = '';
    const img = document.createElement('img');
    img.src = slides[index].image;
    img.alt = slides[index].alt || 'Concept illustration';
    slideImage.appendChild(img);

    slideContent.textContent = slides[index].content;

    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === slides.length - 1);

    updateSidebar();
    slideContent.focus();
  }

  prevBtn.addEventListener('click', () => {
    if (currentSlide > 0) {
      saveCompletion(currentSlide);
      showSlide(currentSlide - 1);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentSlide < slides.length - 1) {
      saveCompletion(currentSlide);
      showSlide(currentSlide + 1);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
      if (!nextBtn.disabled) nextBtn.click();
    } else if (e.key === 'ArrowLeft') {
      if (!prevBtn.disabled) prevBtn.click();
    }
  });

  showSlide(0);
</script>
</body>
</html>
